<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2>Cadastrar Produto</h2>
        <form id="formProduto" class="mt-4">
            <div class="mb-3">
                <label>Código de Barras (Bipe aqui)</label>
                <input type="text" class="form-control" id="codigoBarras" autofocus required>
            </div>
            <div class="mb-3">
                <label>Descrição</label>
                <input type="text" class="form-control" id="descricao" required>
            </div>
            <div class="mb-3">
                <label>Valor (R$)</label>
                <input type="number" step="0.01" class="form-control" id="valor" required>
            </div>
            <div class="mb-3">
                <label>Tipo (Ex: Bebida, Limpeza)</label>
                <input type="text" class="form-control" id="tipoProduto">
            </div>
            <button type="submit" class="btn btn-primary">Salvar no Banco</button>
            <a href="/" class="btn btn-secondary">Voltar ao Menu</a>
        </form>
    </div>

    <script>
        document.getElementById('formProduto').addEventListener('submit', function(e) {
            e.preventDefault();
            const produto = {
                codigoBarras: document.getElementById('codigoBarras').value,
                descricao: document.getElementById('descricao').value,
                valor: parseFloat(document.getElementById('valor').value),
                tipoProduto: document.getElementById('tipoProduto').value
            };
            fetch('/api/produtos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(produto)
            }).then(res => {
                if(res.ok) {
                    alert('Salvo!');
                    document.getElementById('formProduto').reset();
                    document.getElementById('codigoBarras').focus();
                } else {
                    alert('Erro ao salvar. Verifique se o código já existe.');
                }
            });
        });
    </script>
</body>
</html>
