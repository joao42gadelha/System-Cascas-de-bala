<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ponto de Movimentação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center mb-4">Leitor de Estoque</h2>
        
        <div class="card p-4 mx-auto" style="max-width: 500px;">
            <div class="mb-3">
                <label class="form-label fw-bold text-danger">Operação Atual:</label>
                <select id="tipoMovimentacao" class="form-select form-select-lg mb-3">
                    <option value="ENTRADA">ENTRADA (Adicionar ao Estoque)</option>
                    <option value="SAIDA" selected>SAÍDA (Venda / Baixa)</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Quantidade por Bipe:</label>
                <input type="number" id="quantidade" class="form-control" value="1" min="1">
            </div>

            <div class="mb-4 text-center">
                <label class="form-label fs-5">Aguardando Código de Barras...</label>
                <input type="text" id="inputLeitor" class="form-control form-control-lg text-center" placeholder="|||||||||||||||||||||||||" autofocus>
            </div>
            
            <a href="/" class="btn btn-secondary w-100">Voltar ao Menu</a>
        </div>
    </div>

    <script>
        const inputLeitor = document.getElementById('inputLeitor');

        inputLeitor.addEventListener('keypress', function(e) {
            // A pistola de código de barras sempre envia um 'Enter' (código 13) no final da leitura
            if (e.key === 'Enter') {
                e.preventDefault();
                const codigoLido = inputLeitor.value.trim();
                const tipo = document.getElementById('tipoMovimentacao').value;
                const qtd = parseInt(document.getElementById('quantidade').value);

                if (!codigoLido) return;

                // 1. Busca todos os produtos para encontrar o ID correspondente ao código de barras
                fetch('/api/produtos')
                    .then(res => res.json())
                    .then(produtos => {
                        const produtoEncontrado = produtos.find(p => p.codigoBarras === codigoLido);
                        
                        if (!produtoEncontrado) {
                            alert("Produto não cadastrado no sistema!");
                            inputLeitor.value = '';
                            return;
                        }

                        // 2. Monta a movimentação com o ID do produto encontrado
                        const movimentacao = {
                            produto: { id: produtoEncontrado.id },
                            quantidade: qtd,
                            tipoMovimentacao: tipo
                        };

                        // 3. Envia para o backend processar a regra de negócio do estoque
                        return fetch('/api/movimentacoes', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(movimentacao)
                        });
                    })
                    .then(res => {
                        if (res && res.ok) {
                            alert('Sucesso! Movimentação de ' + tipo + ' registrada.');
                        } else if (res) {
                            alert('Erro: Saldo insuficiente ou falha no sistema.');
                        }
                    })
                    .catch(err => console.error(err))
                    .finally(() => {
                        // Limpa o campo e devolve o foco para o próximo produto
                        inputLeitor.value = '';
                        inputLeitor.focus();
                    });
            }
        });
    </script>
</body>
</html>
